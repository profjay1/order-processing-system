<div class="container">
  <div class="card" *ngIf="order() as o">
    <h2>Order {{ o.id }}</h2>
    <p>Customer: {{ o.customerId }}</p>
    <p>Total: ${{ o.totalAmount }}</p>
    <p>
      Status:
      <span class="status-badge" [ngClass]="'status-' + o.status">{{ o.status }}</span>
    </p>
    <p *ngIf="o.status === 'INVENTORY_RESERVED' || o.status === 'PENDING'" style="color:#64748b; font-size:14px;">
      Payment is being processed asynchronously — this page updates automatically.
    </p>
  </div>
  <div class="card" *ngIf="!order()">Loading order...</div>
</div>
