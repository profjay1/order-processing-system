name: Backend CI

on:
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [ develop, main ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build
        run: mvn -B -ntp clean compile

      - name: Unit + integration tests
        run: mvn -B -ntp verify
        # Integration tests use Testcontainers, which needs Docker.
        # GitHub-hosted ubuntu-latest runners have Docker pre-installed.

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Test Results
          path: 'backend/target/surefire-reports/*.xml'
          reporter: java-junit

      - name: Code coverage (JaCoCo)
        run: mvn -B -ntp jacoco:report

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: Build container image
        run: docker build -t order-processing-backend:${{ github.sha }} .
