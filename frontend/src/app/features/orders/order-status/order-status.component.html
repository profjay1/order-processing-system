<div class="container">
  <div class="card" *ngIf="order">
    <h2>Order {{ order.id }}</h2>
    <p>Customer: {{ order.customerId }}</p>
    <p>Total: ${{ order.totalAmount }}</p>
    <p>
      Status:
      <span class="status-badge" [ngClass]="'status-' + order.status">{{ order.status }}</span>
    </p>
    <p *ngIf="order.status === 'INVENTORY_RESERVED' || order.status === 'PENDING'" style="color:#64748b; font-size:14px;">
      Payment is being processed asynchronously — this page updates automatically.
    </p>
  </div>
  <div class="card" *ngIf="!order">Loading order...</div>
</div>
